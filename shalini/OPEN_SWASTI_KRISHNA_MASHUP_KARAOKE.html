const practiceCues=[{"start": 29.45, "end": 39.99, "text": "श्री कृष्ण गोविन्द हरे मुरारी हे नाथ नारायण वासुदेवा", "words": [{"text": "श्री", "start": 29.45, "end": 30.27}, {"text": "कृष्ण", "start": 30.34, "end": 31.16}, {"text": "गोविन्द", "start": 31.23, "end": 32.05}, {"text": "हरे", "start": 32.12, "end": 32.94}, {"text": "मुरारी", "start": 33.01, "end": 34.2}, {"text": "हे", "start": 34.27, "end": 35.09}, {"text": "नाथ", "start": 35.16, "end": 35.98}, {"text": "नारायण", "start": 36.05, "end": 37.36}, {"text": "वासुदेवा", "start": 37.43, "end": 39.94}]}, {"start": 39.39, "end": 50.63, "text": "श्री कृष्ण गोविन्द हरे मुरारी हे नाथ नारायण वासुदेवा", "words": [{"text": "श्री", "start": 39.39, "end": 40.21}, {"text": "कृष्ण", "start": 40.28, "end": 41.1}, {"text": "गोविन्द", "start": 41.17, "end": 42.14}, {"text": "हरे", "start": 42.21, "end": 43.34}, {"text": "मुरारी", "start": 43.41, "end": 44.82}, {"text": "हे", "start": 44.89, "end": 45.71}, {"text": "नाथ", "start": 45.78, "end": 46.6}, {"text": "नारायण", "start": 46.67, "end": 48.1}, {"text": "वासुदेवा", "start": 48.17, "end": 50.58}]}, {"start": 50.03, "end": 56.15, "text": "पितु मात स्वामी सखा हमारे", "words": [{"text": "पितु", "start": 50.03, "end": 50.85}, {"text": "मात", "start": 50.92, "end": 51.74}, {"text": "स्वामी", "start": 51.81, "end": 52.72}, {"text": "सखा", "start": 52.79, "end": 54.3}, {"text": "हमारे", "start": 54.37, "end": 56.1}]}, {"start": 55.55, "end": 61.55, "text": "पितु मात स्वामी सखा हमारे", "words": [{"text": "पितु", "start": 55.55, "end": 56.37}, {"text": "मात", "start": 56.44, "end": 57.26}, {"text": "स्वामी", "start": 57.33, "end": 58.15}, {"text": "सखा", "start": 58.22, "end": 59.34}, {"text": "हमारे", "start": 59.41, "end": 61.5}]}, {"start": 60.97, "end": 65.57, "text": "हे नाथ नारायण वासुदेवा", "words": [{"text": "हे", "start": 60.97, "end": 61.79}, {"text": "नाथ", "start": 61.86, "end": 62.68}, {"text": "नारायण", "start": 62.75, "end": 63.58}, {"text": "वासुदेवा", "start": 63.65, "end": 65.52}]}];
const INTRO=29.0;
const CLIP_END=65.0;
const SOURCES={vocals:'vocals.mp3',instrumental:'instrumental.mp3'};
const a=document.getElementById('audio'), ly=document.getElementById('lyrics'), tm=document.getElementById('time');
const btnV=document.getElementById('btn-vocals'), btnI=document.getElementById('btn-inst');
let mode='vocals';
function cueList(){return mode==='instrumental'?practiceCues:cues;}
function holdFor(){return mode==='instrumental'?1.05:0.32;}
function fmt(t){return Math.floor(t/60)+':'+(String(Math.floor(t%60)).padStart(2,'0'));}
function findCue(t){
  if(t<INTRO) return null;
  const list=cueList();
  for(let i=list.length-1;i>=0;i--) if(t>=list[i].start-0.1&&t<=list[i].end+0.15) return list[i];
  return null;
}
function render(c,t){
  if(!c||!c.words) return '<span style="color:#888">♪</span>';
  const hold=holdFor();
  let ai=-1;
  for(let i=c.words.length-1;i>=0;i--) if(t>=c.words[i].start&&t<c.words[i].end+hold){ai=i;break;}
  if(ai<0&&t<c.words[0].start) ai=0;
  const hl=mode==='instrumental';
  return c.words.map((w,i)=>{
    let cls='w';
    if(hl) cls+=(i===ai?' active':t>=w.end+hold?' done':' next');
    let st='';
    if(hl&&i===ai) st=' style="color:#000;background:#ffd700;font-weight:800;transform:scale(1.12);box-shadow:0 0 18px #ffd700cc"';
    else if(hl&&t>=w.end+hold) st=' style="color:#777"';
    else if(hl) st=' style="color:#ccc"';
    return `<span class="${cls}"${st}>${w.text}</span>`;
  }).join(' ');
}
function tick(){
  const t=a.currentTime||0; const c=findCue(t);
  const hold=holdFor();
  ly.innerHTML=c?render(c,t):(t<INTRO?'<span style="color:#888;font-size:1.1rem">♪ bhajan ♪</span>':'<span style="color:#666">♪</span>');
  const w=c&&c.words?c.words.find(x=>t>=x.start&&t<x.end+hold):null;
  tm.textContent='Time: '+fmt(t)+(w?' · ▶ '+w.text:'');
}
function setMode(next){
  if(next===mode) return;
  const t=a.currentTime||0, playing=!a.paused;
  mode=next;
  document.body.classList.toggle('practice', next==='instrumental');
  btnV.classList.toggle('active', next==='vocals');
  btnI.classList.toggle('active', next==='instrumental');
  a.src=SOURCES[next];
  const resume=()=>{a.currentTime=Math.min(t,CLIP_END); if(playing) a.play().catch(()=>{}); a.removeEventListener('loadedmetadata',resume); tick();};
  a.addEventListener('loadedmetadata',resume);
  a.load();
  tick();
}
btnV.addEventListener('click',()=>setMode('vocals'));
btnI.addEventListener('click',()=>setMode('instrumental'));
a.addEventListener('timeupdate',()=>{if(a.currentTime>=CLIP_END){a.pause();a.currentTime=CLIP_END;}});
let raf=0; function loop(){tick(); if(!a.paused&&!a.ended) raf=requestAnimationFrame(loop);}
a.addEventListener('loadedmetadata',tick);
a.addEventListener('timeupdate',tick); a.addEventListener('seeked',tick);
a.addEventListener('play',()=>{cancelAnimationFrame(raf);loop();});
a.addEventListener('pause',()=>cancelAnimationFrame(raf));
tick();
