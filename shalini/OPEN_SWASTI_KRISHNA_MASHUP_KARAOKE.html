function fmt(t){return Math.floor(t/60)+':'+(String(Math.floor(t%60)).padStart(2,'0'));}
function inTune(t){return TUNE_GAPS.some(g=>t>=g[0]&&t<=g[1]);}
function findCue(t){
  if(t<INTRO||inTune(t)) return null;
  const list=cueList();
  let best=null, bestScore=-1;
  for(const c of list){
    if(t<c.start-0.08||t>c.end+0.12) continue;
    const hit=(c.words||[]).some(w=>t>=w.start-0.05&&t<=w.end+0.1);

  }
  if(best) return best;
  let near=null, nearD=999;
  for(const c of list){
    if(t<c.start-0.35||t>c.end+0.35) continue;
    const d=t<c.start?c.start-t:t-c.end;
    if(d<nearD){nearD=d; near=c;}
  }
  return near;
}

  if(!c||!c.words||!c.words.length) return c?c.text:'♪';

}
