<h1>Special Krishna Bhajans Mashup — Shalini Gulati</h1>

<script>
const cues=[{"start": 29.0, "end": 38.99, "text": "श्री कृष्ण गोविन्द हरे मुरारी हे नाथ नारायण वासुदेवा", "words": [{"text": "श्री", "start": 29.0, "end": 29.48}, {"text": "कृष्ण", "start": 29.48, "end": 29.92}, {"text": "गोविन्द", "start": 29.92, "end": 31.0}, {"text": "हरे", "start": 31.0, "end": 32.2}, {"text": "मुरारी", "start": 32.2, "end": 33.82}, {"text": "हे", "start": 33.82, "end": 34.48}, {"text": "नाथ", "start": 34.48, "end": 35.14}, {"text": "नारायण", "start": 35.14, "end": 36.98}, {"text": "वासुदेवा", "start": 36.98, "end": 38.94}]}, {"start": 38.94, "end": 49.63, "text": "श्री कृष्ण गोविन्द हरे मुरारी हे नाथ नारायण वासुदेवा", "words": [{"text": "श्री", "start": 38.94, "end": 39.68}, {"text": "कृष्ण", "start": 39.68, "end": 40.56}, {"text": "गोविन्द", "start": 40.56, "end": 41.76}, {"text": "हरे", "start": 41.76, "end": 42.96}, {"text": "मुरारी", "start": 42.96, "end": 44.44}, {"text": "हे", "start": 44.44, "end": 45.11}, {"text": "नाथ", "start": 45.11, "end": 45.78}, {"text": "नारायण", "start": 45.78, "end": 47.72}, {"text": "वासुदेवा", "start": 47.72, "end": 49.58}]}, {"start": 49.58, "end": 55.15, "text": "पितु मात स्वामी सखा हमारे", "words": [{"text": "पितु", "start": 49.58, "end": 50.31}, {"text": "मात", "start": 50.31, "end": 51.04}, {"text": "स्वामी", "start": 51.04, "end": 52.34}, {"text": "सखा", "start": 52.34, "end": 53.92}, {"text": "हमारे", "start": 53.92, "end": 55.1}]}, {"start": 55.1, "end": 60.55, "text": "पितु मात स्वामी सखा हमारे", "words": [{"text": "पितु", "start": 55.1, "end": 55.72}, {"text": "मात", "start": 55.72, "end": 56.34}, {"text": "स्वामी", "start": 56.34, "end": 57.68}, {"text": "सखा", "start": 57.68, "end": 58.96}, {"text": "हमारे", "start": 58.96, "end": 60.5}]}, {"start": 60.52, "end": 64.57, "text": "हे नाथ नारायण वासुदेवा", "words": [{"text": "हे", "start": 60.52, "end": 61.18}, {"text": "नाथ", "start": 61.18, "end": 61.84}, {"text": "नारायण", "start": 61.84, "end": 63.2}, {"text": "वासुदेवा", "start": 63.2, "end": 64.52}]}];
const INTRO=29.0;
const CLIP_END=65.0;
const SOURCES={vocals:'vocals.mp3',instrumental:'instrumental.mp3'};
const a=document.getElementById('audio'), ly=document.getElementById('lyrics'), tm=document.getElementById('time');
const btnV=document.getElementById('btn-vocals'), btnI=document.getElementById('btn-inst');
let mode='vocals';
const HOLD=0.32;
function fmt(t){return Math.floor(t/60)+':'+(String(Math.floor(t%60)).padStart(2,'0'));}
function findCue(t){
  if(t<INTRO) return null;
  for(let i=cues.length-1;i>=0;i--) if(t>=cues[i].start-0.1&&t<=cues[i].end+0.15) return cues[i];
  return null;
}
function render(c,t){
  if(!c||!c.words) return '<span style="color:#888">♪</span>';
  let ai=-1;
  for(let i=c.words.length-1;i>=0;i--) if(t>=c.words[i].start&&t<c.words[i].end+HOLD){ai=i;break;}
  if(ai<0&&t<c.words[0].start) ai=0;
  return c.words.map((w,i)=>{
    let cls='w'+(i===ai?' active':t>=w.end+HOLD?' done':' next');
    return `<span class="${cls}">${w.text}</span>`;
  }).join(' ');
}
function tick(){
  const t=a.currentTime||0; const c=findCue(t);
  ly.innerHTML=c?render(c,t):(t<INTRO?'<span style="color:#888;font-size:1.1rem">♪ bhajan ♪</span>':'<span style="color:#666">♪</span>');
  const w=c&&c.words?c.words.find(x=>t>=x.start&&t<x.end+HOLD):null;
  tm.textContent='Time: '+fmt(t)+(w?' · ▶ '+w.text:'');
}
function setMode(next){
  if(next===mode) return;
  const t=a.currentTime||0, playing=!a.paused;
  mode=next;
  document.body.classList.toggle('practice', next==='instrumental');
  btnV.classList.toggle('active', next==='vocals');
  btnI.classList.toggle('active', next==='instrumental');
  a.src=SOURCES[next];
  const resume=()=>{a.currentTime=Math.min(t,CLIP_END); if(playing) a.play().catch(()=>{}); a.removeEventListener('loadedmetadata',resume); tick();};
  a.addEventListener('loadedmetadata',resume);
  a.load();
  tick();
}
btnV.addEventListener('click',()=>setMode('vocals'));
btnI.addEventListener('click',()=>setMode('instrumental'));
a.addEventListener('timeupdate',()=>{if(a.currentTime>=CLIP_END){a.pause();a.currentTime=CLIP_END;}});
let raf=0; function loop(){tick(); if(!a.paused&&!a.ended) raf=requestAnimationFrame(loop);}
a.addEventListener('loadedmetadata',tick);
a.addEventListener('timeupdate',tick); a.addEventListener('seeked',tick);
a.addEventListener('play',()=>{cancelAnimationFrame(raf);loop();});
a.addEventListener('pause',()=>cancelAnimationFrame(raf));
tick();
</script></body></html>
