  btnV.classList.toggle('active', next==='vocals'); btnI.classList.toggle('active', next==='instrumental');
  a.src=SOURCES[next];
  const resume=()=>{a.currentTime=Math.min(t,CLIP_END); if(playing) a.play().catch(()=>{}); a.removeEventListener('loadedmetadata',resume); tick();};
  a.addEventListener('loadedmetadata',resume); a.load(); tick();
}
btnV.addEventListener('click',()=>setMode('vocals'));
btnI.addEventListener('click',()=>setMode('instrumental'));
a.addEventListener('timeupdate',()=>{if(a.currentTime>=CLIP_END){a.pause();a.currentTime=CLIP_END;}});
let raf=0; function loop(){tick(); if(!a.paused&&!a.ended) raf=requestAnimationFrame(loop);}
a.addEventListener('loadedmetadata',tick); a.addEventListener('timeupdate',tick); a.addEventListener('seeked',tick);
a.addEventListener('play',()=>{cancelAnimationFrame(raf);loop();}); a.addEventListener('pause',()=>cancelAnimationFrame(raf));
tick();
</script></body></html>
